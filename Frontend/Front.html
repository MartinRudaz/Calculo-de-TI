<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transformador de Corriente</title>
</head>
<body>
    <h1>Cálculo de Transformador de Corriente</h1>
    <form id="transformerForm">
        <label for="txt">Prestación:</label><input type="number" id="txt" name="txt" required><br>
        <label for="txt2">Corriente Primaria:</label><input type="number" id="txt2" name="txt2" required><br>
        <label for="txt3">Corriente Secundaria:</label><input type="number" id="txt3" name="txt3" required><br>
        <label for="txt4">FS:</label><input type="number" id="txt4" name="txt4" required><br>
        <label for="txt5">Frecuencia:</label><input type="number" id="txt5" name="txt5" required><br>
        <label for="txt6">Factor de Apilado:</label><input type="number" step="0.01" id="txt6" name="txt6" required><br>
        <label for="txt7">Diám. Conductor:</label><input type="number" id="txt7" name="txt7" required><br>
        <label for="txt8">Diám. Interno:</label><input type="number" id="txt8" name="txt8" required><br>
        <label for="txt9">Espiras:</label><input type="number" id="txt9" name="txt9" required><br>
        <label for="txt10">PF:</label><input type="number" step="0.01" id="txt10" name="txt10" required><br>
        <label for="txt11">Ancho de Fleje:</label><input type="number" id="txt11" name="txt11" required><br>
        <label for="txt12">Apilado:</label><input type="number" id="txt12" name="txt12" required><br>
        <button type="button" onclick="calculate()">Calcular y guardar</button>
        <button type="button" onclick="loadHistory()">Ver historial</button>
    </form>

    <h2>Último resultado:</h2>
    <pre id="result"></pre>

    <h2>Historial:</h2>
    <pre id="history"></pre>

    <script>
        const API_BASE_URL = "http://127.0.0.1:8000";

        function formToJson() {
            const formData = new FormData(document.getElementById("transformerForm"));
            const data = {};
            formData.forEach((value, key) => {
                data[key] = parseFloat(value);
            });
            return data;
        }

        async function calculate() {
            const data = formToJson();

            const response = await fetch(`${API_BASE_URL}/calculate`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            });

            if (!response.ok) {
                const error = await response.text();
                document.getElementById("result").textContent = `Error: ${error}`;
                return;
            }

            const result = await response.json();
            document.getElementById("result").textContent = JSON.stringify(result, null, 2);

            await loadHistory();
        }

        async function loadHistory() {
            const response = await fetch(`${API_BASE_URL}/calculations?limit=10`);

            if (!response.ok) {
                const error = await response.text();
                document.getElementById("history").textContent = `Error al cargar historial: ${error}`;
                return;
            }

            const history = await response.json();
            document.getElementById("history").textContent = JSON.stringify(history, null, 2);
        }
    </script>
</body>
</html>
